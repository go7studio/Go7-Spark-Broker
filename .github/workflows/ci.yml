name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check .
      - run: python -m unittest discover -s tests -v
      - run: bash -n deploy-user.sh
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: |
          python -m venv /tmp/go7-spark-broker-smoke
          /tmp/go7-spark-broker-smoke/bin/pip install --disable-pip-version-check dist/*.whl
          /tmp/go7-spark-broker-smoke/bin/sparkctl --help
          /tmp/go7-spark-broker-smoke/bin/spark-mcp </dev/null
