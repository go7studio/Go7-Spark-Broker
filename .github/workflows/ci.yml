name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check .
      - run: python -m unittest discover -s tests -v
      - run: bash -n deploy-user.sh
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: |
          python -m venv /tmp/go7-spark-broker-smoke
          /tmp/go7-spark-broker-smoke/bin/pip install --disable-pip-version-check dist/*.whl
          /tmp/go7-spark-broker-smoke/bin/sparkctl --help
          /tmp/go7-spark-broker-smoke/bin/spark-mcp </dev/null
